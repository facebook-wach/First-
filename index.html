<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Loading...</title>

<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<meta id="og-image" property="og:image" content="">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta id="tw-title" name="twitter:title" content="">
<meta id="tw-desc" name="twitter:description" content="">
<meta id="tw-image" name="twitter:image" content="">

<style>
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f5f0;
    color: #1a1a1a;
  }
  /* Poori screen ko clickable link banane ke liye */
  #full-screen-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    padding: 35px 25px;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    max-width: 400px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(0,0,0,0.04);
  }
  h2 { 
    font-size: 20px; 
    margin-top: 0; 
    margin-bottom: 12px; 
    color: #111; 
  }
  p { 
    font-size: 15px; 
    color: #555; 
    margin-bottom: 25px; 
    line-height: 1.5;
  }
  .tap-btn {
    display: inline-block;
    background: #0066ff;
    color: #fff;
    padding: 14px 30px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
    transition: background 0.2s;
  }
  .tap-btn:hover { 
    background: #0052cc; 
  }
</style>
</head>
<body>

<!-- Poori screen clickable banane ke liye anchor tag -->
<a id="full-screen-link" href="#">
  <div class="card">
    <h2 id="heading-text">Loading...</h2>
    <p id="msg">Please wait while content is being fetched.</p>
    <div class="tap-btn" id="btn-text">Tap to Continue</div>
  </div>
</a>

<script>
  const SUPABASE_URL = "https://lgogrnuocpxzhydbanyz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JU8UB5FJrQY81Gxpm7ZkuQ_DslfF9p9";

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  const mainLink = document.getElementById('full-screen-link');

  // Jab tak data load nahi hota, link ko disable rakhein taaki empty redirect na ho
  mainLink.addEventListener('click', function(e) {
    if (!mainLink.getAttribute('href') || mainLink.getAttribute('href') === '#') {
      e.preventDefault();
    }
  });

  if(!id){
    document.getElementById('heading-text').textContent = 'Error';
    document.getElementById('msg').textContent = 'Invalid link parameter.';
    document.getElementById('btn-text').style.display = 'none';
  } else {
    fetch(SUPABASE_URL + '/rest/v1/links?id=eq.' + encodeURIComponent(id) + '&select=*', {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    })
    .then(r => r.json())
    .then(rows => {
      const data = rows && rows[0];
      if(!data){
        document.getElementById('heading-text').textContent = 'Not Found';
        document.getElementById('msg').textContent = 'The requested link does not exist.';
        document.getElementById('btn-text').style.display = 'none';
        return;
      }
      
      // Social Media Preview Meta Tags Update
      document.getElementById('page-title').textContent = data.title || 'Secure Link';
      document.getElementById('og-title').setAttribute('content', data.title || '');
      document.getElementById('og-desc').setAttribute('content', data.description || '');
      document.getElementById('og-image').setAttribute('content', data.image || '');
      document.getElementById('tw-title').setAttribute('content', data.title || '');
      document.getElementById('tw-desc').setAttribute('content', data.description || '');
      document.getElementById('tw-image').setAttribute('content', data.image || '');

      // Content UI Update
      document.getElementById('heading-text').textContent = data.title || 'View Content';
      document.getElementById('msg').textContent = data.description || 'Tap anywhere on the screen to proceed securely.';
      
      // Target link ko poori screen par set karna
      mainLink.href = data.target;
    })
    .catch(() => {
      document.getElementById('heading-text').textContent = 'Connection Error';
      document.getElementById('msg').textContent = 'Unable to load link data.';
      document.getElementById('btn-text').style.display = 'none';
    });
  }
</script>
</body>
</html>
